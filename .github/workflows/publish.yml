name: Publish

# Publishing a GitHub release uploads that tag's build to PyPI.
# Running this workflow by hand uploads the current branch's build to TestPyPI instead.
# Neither needs a stored token: PyPI trusts this workflow file ("trusted publishing").

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        # Read the version as text: bursakit's dependencies are not installed yet.
        # Tags are "v" + the version, e.g. v0.1.1 for __version__ = "0.1.1".
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bursakit/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::could not read __version__ from bursakit/__init__.py"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match __version__ $version (expected v$version)"
            exit 1
          fi
          echo "release tag $TAG matches __version__ $version"

      - run: python -m build
      # Fails on a README that PyPI would not render.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bursakit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rerun of the same version is a no-op instead of a failure.
          skip-existing: true

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bursakit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
