name: Live sources

# Asks the real sources for a little data and checks the answers still have the
# shape bursakit expects. The CI workflow never touches the network; this one
# is what notices when Yahoo, BNM or data.gov.my change.

on:
  schedule:
    # 20:30 in Malaysia: after Bursa closes and BNM publishes its 17:00 rates.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # -rs lists every test that was skipped because a source rate limited the runner.
      - run: pytest tests_live -v -rs
