name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        pandas: [""]
        include:
          # The oldest pandas the package declares support for.
          - { os: ubuntu-latest, python: "3.10", pandas: "pandas==2.2.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]" ${{ matrix.pandas }}
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # The suite blocks sockets itself; a test that reaches for the network fails.
      - run: pytest --cov --cov-fail-under=85
